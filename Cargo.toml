[package]
name = "carpenter-cli"
version = "0.1.0"
edition = "2021"
description = "Rust Project Scripts - An interactive CLI tool for running project scripts"
authors = ["EvarinthoSec <evarin@anantix.network>"]
license = "Apache-2.0"

[[bin]]
name = "carpenter-cli"
path = "src/main.rs"

[dependencies]
inquire = "0.6"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
simplelog = "0.12"
directories = "5.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
dotenv = "0.15"

[features]
test-utils = []

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.0"
predicates = "3.0"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["test-utils"]
